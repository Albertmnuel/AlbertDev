<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - AlbertDev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    <nav class="navbar">
        <h1 class="logo">Albert<span>Dev</span></h1>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <section class="hero small-hero">
        <div class="hero-content">
            <h1>Contact <span class="text-gradient">Us</span></h1>
            <p>Let’s build something amazing together.</p>
        </div>
    </section>

    <div class="container" style="display: flex; justify-content: center;">
        <div class="card contact-card-wrapper" style="width: 500px; max-width: 95%;">

            <p class="contact-note">
                We'd love to hear from you! Send us a message or reach out directly below.
            </p>

            <div class="contact-info" style="margin-bottom: 25px; text-align: left; display: flex; flex-direction: column; gap: 10px;">
                <p><strong><i class="fas fa-phone" style="color: var(--accent-purple);"></i> Phone:</strong> 
                    <a href="tel:+2348028577412" style="color: var(--text-primary); text-decoration: none;">+234 8028577412</a>
                </p>

                <p><strong><i class="fas fa-envelope" style="color: var(--accent-purple);"></i> Email:</strong> 
                    <a href="mailto:albertdev981@email.com" style="color: var(--text-primary); text-decoration: none;">albertdev981@gmail.com</a>
                </p>
            </div>

            <form id="contactForm" class="contact-form" action="https://formspree.io/f/maqdkdrg" method="POST">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
                <button type="submit" style="width: 100%;">Send Message</button>
            </form>

            <p id="successMessage" class="success-message" style="margin-top: 15px; display: none; font-weight: bold; color: #10B981;"></p>

        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <h2>Albert<span class="text-purple">Dev</span></h2>
            <p>© 2026 AlbertDev. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const form = document.getElementById("contactForm");
        const successMessage = document.getElementById("successMessage");

        form.addEventListener("submit", function(e) {
            e.preventDefault(); 

            const data = new FormData(form);

            fetch(form.action, {
                method: "POST",
                body: data,
                headers: { 'Accept': 'application/json' }
            })
            .then(response => {
                if(response.ok) {
                    successMessage.textContent = "✅ Thank you! Your message has been sent.";
                    successMessage.style.display = "block";
                    form.reset();
                } else {
                    successMessage.textContent = "⚠️ Oops! Something went wrong. Try again.";
                    successMessage.style.color = "#EF4444";
                    successMessage.style.display = "block";
                }
            })
            .catch(() => {
                successMessage.textContent = "⚠️ Oops! Something went wrong. Try again.";
                successMessage.style.color = "#EF4444";
                successMessage.style.display = "block";
            });
        });
    </script>
</body>
</html>
